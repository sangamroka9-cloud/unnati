<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stop Unnati From Exploding</title>

<style>
body {
  margin:0;
  font-family: Arial;
  overflow:hidden;
  background: linear-gradient(to bottom, #ffd6e7, #ffb3c6);
  transition:0.4s;
}

#title {
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  color:#b3003c;
}

#game {
  width:100vw;
  height:100vh;
  position:relative;
}

/* CHARACTER */
#girl {
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.head {
  width:70px;height:70px;border:4px solid black;border-radius:50%;margin:auto;background:#ffe0e0;
}
.eye {
  width:8px;height:8px;background:black;border-radius:50%;position:absolute;top:25px;
}
.eye.left { left:18px; }
.eye.right { right:18px; }

.mouth {
  width:20px;height:10px;border-bottom:3px solid black;margin:10px auto 0;
}

.body {
  width:6px;height:90px;background:black;margin:auto;
}

.arm {
  width:80px;height:4px;background:black;position:absolute;top:120px;left:50%;transform:translateX(-50%);
}

.legs {
  width:80px;height:4px;background:black;margin:auto;transform:translateY(20px);
}

#emotion {
  margin-top:10px;
  font-weight:bold;
}

/* ANGER */
#angerBox {
  position:absolute;
  top:70px;
  left:20px;
  width:240px;
  background:white;
  border:3px solid #ff4d88;
  border-radius:12px;
  padding:10px;
}

#bar {
  width:60%;
  height:20px;
  background:red;
  border-radius:10px;
  transition:0.2s;
}

/* SPEECH */
#speech {
  position:absolute;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:15px;
  border-radius:10px;
  border:3px solid black;
  font-weight:bold;
  display:none;
  text-align:center;
  max-width:300px;
}

/* CHOICES */
#choices {
  position:absolute;
  bottom:30px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:20px;
}

button {
  padding:12px 16px;
  border-radius:12px;
  border:2px solid #ff4d88;
  background:white;
  font-weight:bold;
  cursor:pointer;
  width:200px;
}

/* OVERLAY */
#overlay {
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:100;
}

/* SHAKE */
.shake {
  animation: shake 0.2s infinite;
}
@keyframes shake {
  0% { transform:translate(-50%,-50%) translateX(-4px); }
  50% { transform:translate(-50%,-50%) translateX(4px); }
  100% { transform:translate(-50%,-50%) translateX(-4px); }
}

/* EXPLOSION */
#boom {
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:90px;
}
</style>
</head>

<body>

<div id="game">

<div id="title">💥 Stop Unnati From Exploding 💥</div>

<div id="overlay">
  <h1>Game Start</h1>
  <p>Calm her before she explodes emotionally 😭</p>
  <button onclick="startIntro()">Start</button>
</div>

<div id="speech"></div>

<div id="angerBox">
  <b>ANGER</b>
  <div id="bar"></div>
</div>

<div id="girl">
  <div class="head">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>
  <div class="arm"></div>
  <div class="body"></div>
  <div class="legs"></div>
  <div id="emotion">CALM</div>
</div>

<div id="choices">
  <button onclick="choose(true)">💐 Apologise</button>
  <button onclick="choose(false)">😐 Ignore</button>
</div>

<div id="boom">💥💥💥</div>

</div>

<script>

let anger = 60;
let step = 0;
let started = false;

const intro = [
  ["Ta Jatha", 10],
  ["ni gar dai nas", 20],
  ["khup raksi khayera bas sale", 30],
  ["murda aru kt sanga bolis", 40],
  ["ghar auna pardai na jatha", 50],
  ["j gare ni gar sale khate jatha muji", 60]
];

const story = [
  "She is waiting for your response",
  "She feels ignored",
  "She is getting more emotional",
  "Final chance..."
];

const speech = document.getElementById("speech");
const bar = document.getElementById("bar");
const emotion = document.getElementById("emotion");
const girl = document.getElementById("girl");
const overlay = document.getElementById("overlay");

function update() {
  bar.style.width = anger + "%";

  if (anger < 30) emotion.innerText = "CALM ❤️";
  else if (anger < 60) emotion.innerText = "ANNOYED 😐";
  else if (anger < 85) emotion.innerText = "ANGRY 😡";
  else girl.classList.add("shake");

  if (anger >= 100) explode();
}

function startIntro() {
  overlay.style.display = "none";
  runIntro();
}

/* INTRO DIALOGUE */
let i = 0;

function runIntro() {
  if (i >= intro.length) {
    started = true;
    runGame();
    return;
  }

  speech.style.display = "block";
  speech.innerText = intro[i][0];

  anger = intro[i][1];
  update();

  i++;
  setTimeout(runIntro, 1200);
}

/* GAME LOOP */
let passive = setInterval(() => {
  if (!started) return;

  anger += 1.5; // 👈 passive anger increase
  update();

}, 1500);

function runGame() {
  step = 0;
  next();
}

function next() {
  if (step >= story.length) {
    speech.style.display = "none";
    return;
  }

  speech.style.display = "block";
  speech.innerText = story[step];
}

function choose(good) {

  if (!started) return;

  if (good) anger -= 15;
  else anger += 20;

  step++;
  next();
  update();
}

function explode() {
  document.getElementById("boom").style.display = "flex";
  girl.style.display = "none";

  setTimeout(() => {
    alert("💥 She emotionally exploded!");
    location.reload();
  }, 1200);
}

update();

</script>

</body>
</html>
