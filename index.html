<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Unnani Game</title>

<style>
body {
  margin:0;
  font-family: Arial;
  overflow:hidden;
  background: linear-gradient(to bottom, #ffd6e7, #ffb3c6);
}

/* TITLE */
#title {
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#b3003c;
}

/* TIMER */
#timer {
  position:absolute;
  top:70px;
  right:20px;
  background:white;
  padding:10px;
  border:2px solid black;
  border-radius:10px;
  font-weight:bold;
}

/* ANGER BAR */
#barBox {
  position:absolute;
  top:70px;
  left:20px;
  width:200px;
  background:white;
  border:2px solid #ff4d88;
  border-radius:10px;
  padding:10px;
}

#bar {
  width:20%;
  height:15px;
  background:red;
  border-radius:10px;
}

/* INTRO / QUESTION */
#intro, #question {
  position:absolute;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:15px;
  border-radius:10px;
  border:2px solid black;
  width:320px;
  text-align:center;
  font-weight:bold;
  display:none;
}

/* OPTIONS */
#options {
  position:absolute;
  bottom:30px;
  width:100%;
  display:none;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
}

button {
  padding:12px;
  width:240px;
  border-radius:10px;
  border:2px solid #ff4d88;
  background:white;
  font-weight:bold;
  cursor:pointer;
}

/* STICK FIGURE */
#girl {
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.head {
  width:90px;
  height:90px;
  border:3px solid black;
  border-radius:50%;
  background:#ffe0e0;
  position:relative;
  margin:auto;
}

.eye {
  width:8px;
  height:8px;
  background:black;
  border-radius:50%;
  position:absolute;
  top:30px;
}
.eye.left { left:25px; }
.eye.right { right:25px; }

.mouth {
  width:25px;
  height:10px;
  border-bottom:3px solid black;
  margin:18px auto 0;
  border-radius:50%;
}

.body {
  width:6px;
  height:90px;
  background:black;
  margin:auto;
}

.arms {
  width:100px;
  height:4px;
  background:black;
  margin:-50px auto 0;
}

.legs {
  width:80px;
  height:4px;
  background:black;
  margin:40px auto 0;
}

#emotion {
  margin-top:10px;
  font-weight:bold;
}

/* END */
#end {
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,0.85);
  color:white;
  text-align:center;
}

/* EXPLOSION */
#boom {
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:90px;
}
</style>
</head>

<body>

<div id="title">💖 Unnani Game 💖</div>

<div id="timer">90</div>

<div id="barBox">
  <b>ANGER</b>
  <div id="bar"></div>
</div>

<div id="intro"></div>
<div id="question"></div>

<div id="options"></div>

<div id="girl">
  <div class="head">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>
  <div class="arms"></div>
  <div class="body"></div>
  <div class="legs"></div>
  <div id="emotion">CALM</div>
</div>

<div id="boom">💥</div>

<div id="end">
  <h1 id="endText"></h1>
  <button onclick="location.reload()">Play Again</button>
</div>

<script>

/* STATE */
let anger = 20;
let q = 0;
let i = 0;
let started = false;
let gameOver = false;
let timeLeft = 90;

/* ELEMENTS */
const introBox = document.getElementById("intro");
const questionBox = document.getElementById("question");
const optionsBox = document.getElementById("options");
const bar = document.getElementById("bar");
const timer = document.getElementById("timer");
const emotion = document.getElementById("emotion");
const end = document.getElementById("end");
const endText = document.getElementById("endText");
const boom = document.getElementById("boom");

/* INTRO */
const introLines = [
  "Ta Jatha",
  "Reply ni gar dai nas",
  "khup raksi khayera bas sale",
  "murda aru kt sanga bolis",
  "ghar auna pardai na jatha",
  "j gare ni gar sale khate jatha muji"
];

/* QUESTIONS */
const questions = [
{
q:"What is her favourite food/snack?",
options:[
["Chatpate 😋",-10],
["Dal Bhat 🍛",10],
["Momo 🥟",10],
["Chowmein 🍜",10]
]
},
{
q:"What should you do when she is angry?",
options:[
["Ignore 😐",15],
["Apologise 💖",-15],
["Argue 😡",25]
]
},
{
q:"What builds trust?",
options:[
["Honesty 🤍",-15],
["Lies 🤥",20],
["Secrets 😶",20]
]
}
];

/* TIMER */
setInterval(() => {
  if(gameOver) return;

  timeLeft--;
  timer.innerText = timeLeft;

  if(timeLeft <= 0){
    lose("⏰ TIME OUT!");
  }
},1000);

/* INTRO */
function runIntro(){

  introBox.style.display = "block";
  questionBox.style.display = "none";
  optionsBox.style.display = "none";

  if(i >= introLines.length){
    introBox.style.display = "none";
    started = true;
    loadQuestion();
    return;
  }

  introBox.innerText = introLines[i];
  anger += 5;

  update();

  i++;
  setTimeout(runIntro, 1200);
}

/* QUESTIONS */
function loadQuestion(){

  if(!started || gameOver) return;

  questionBox.style.display = "block";
  optionsBox.style.display = "flex";

  if(q >= questions.length){
    win();
    return;
  }

  let current = questions[q];

  questionBox.innerText = current.q;
  optionsBox.innerHTML = "";

  current.options.forEach(opt => {

    let btn = document.createElement("button");
    btn.innerText = opt[0];

    btn.onclick = () => {
      anger += opt[1];
      q++;
      update();
      loadQuestion();
    };

    optionsBox.appendChild(btn);
  });
}

/* UPDATE */
function update(){

  bar.style.width = anger + "%";

  if(!gameOver && started){
    if(anger <= 0) win();
    if(anger >= 100) explode();
  }

  if(anger < 30) emotion.innerText = "CALM ❤️";
  else if(anger < 60) emotion.innerText = "OK 😐";
  else emotion.innerText = "ANGRY 😡";
}

/* WIN */
function win(){
  gameOver = true;
  end.style.display = "flex";
  endText.innerHTML = "💖 I LOVE YOU 💖";
}

/* EXPLODE */
function explode(){
  lose("💥 SHE EXPLODED!");
}

/* LOSE */
function lose(msg){
  gameOver = true;
  boom.style.display = "flex";

  setTimeout(() => {
    end.style.display = "flex";
    endText.innerHTML = msg;
  },1000);
}

/* START */
update();
runIntro();

</script>

</body>
</html>
