<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stop Unnati From Exploding</title>

<style>
body {
  margin:0;
  font-family: Arial;
  overflow:hidden;
  background: linear-gradient(to bottom, #ffd6e7, #ffb3c6);
  transition:0.4s;
}

#title {
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-size:26px;
  font-weight:bold;
  color:#b3003c;
}

#game {
  width:100vw;
  height:100vh;
  position:relative;
}

/* STICK FIGURE */
#girl {
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
}

.head {
  width:60px;height:60px;border:4px solid black;border-radius:50%;margin:auto;
}
.body {
  width:4px;height:90px;background:black;margin:auto;
}
.arms {
  width:80px;height:4px;background:black;margin:-55px auto 0;
}
.legs {
  width:80px;height:4px;background:black;margin:45px auto 0;
}

#emotion {
  text-align:center;
  font-weight:bold;
  margin-top:10px;
}

/* SHAKE */
.shake {
  animation: shake 0.2s infinite;
}
@keyframes shake {
  0% { transform:translate(-50%,-50%) translateX(-4px); }
  50% { transform:translate(-50%,-50%) translateX(4px); }
  100% { transform:translate(-50%,-50%) translateX(-4px); }
}

/* ANGER BAR */
#angerBox {
  position:absolute;
  top:70px;
  left:20px;
  width:240px;
  background:white;
  border-radius:12px;
  border:3px solid #ff4d88;
  padding:10px;
}

#bar {
  width:0%;
  height:20px;
  background:red;
  border-radius:10px;
  transition:0.2s;
}

/* SPEECH */
#speech {
  position:absolute;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:15px;
  border-radius:10px;
  border:3px solid black;
  font-weight:bold;
  display:none;
  text-align:center;
}

/* BUTTONS */
#controls {
  position:absolute;
  bottom:20px;
  width:100%;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
}

button {
  padding:10px 14px;
  border-radius:10px;
  border:2px solid #ff4d88;
  background:white;
  font-weight:bold;
  cursor:pointer;
}

/* OVERLAY */
#overlay {
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  color:white;
  z-index:100;
  text-align:center;
}

/* EXPLOSION */
#boom {
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:90px;
}
</style>
</head>

<body>

<div id="game">

<div id="title">💥 Stop Unnati From Exploding 💥</div>

<div id="overlay">
  <h1>Game Starting</h1>
  <p>Calm her before she reaches 100%</p>
  <button onclick="startGame()">Start</button>
</div>

<div id="speech"></div>

<div id="angerBox">
  <b>ANGER</b>
  <div id="bar"></div>
</div>

<div id="girl">
  <div class="head"></div>
  <div class="arms"></div>
  <div class="body"></div>
  <div class="legs"></div>
  <div id="emotion">CALM</div>
</div>

<div id="controls">
  <button onclick="calm(15)">💐 Flowers</button>
  <button onclick="calm(10)">🍫 Chocolate</button>
  <button onclick="calm(20)">😭 Apologise</button>
  <button onclick="calm(12)">☕ Tea</button>
  <button onclick="calm(25)">❤️ Hug</button>
</div>

<div id="boom">💥💥💥</div>

</div>

<script>

let anger = 0;
let started = false;

const speech = [
  ["Ta Jatha", 10],
  ["Reply ni gar dai nas", 20],
  ["khup raksi khayera bas sale", 30],
  ["murda aru kt sanga bolis", 40],
  ["ghar aune pardai na jatha", 50],
  ["j gare ni gar sale khate jatha muji", 60]
];

let i = 0;

const bar = document.getElementById("bar");
const speechBox = document.getElementById("speech");
const overlay = document.getElementById("overlay");
const emotion = document.getElementById("emotion");
const girl = document.getElementById("girl");

function update() {
  bar.style.width = anger + "%";

  if (anger < 30) {
    emotion.innerText = "CALM ❤️";
    document.body.style.background = "#d4f7d4";
    girl.classList.remove("shake");
  }
  else if (anger < 60) {
    emotion.innerText = "ANNOYED 😐";
    document.body.style.background = "#ffe6cc";
  }
  else if (anger < 85) {
    emotion.innerText = "ANGRY 😡";
    document.body.style.background = "#ff9999";
  }
  else {
    emotion.innerText = "ABOUT TO EXPLODE 💥";
    girl.classList.add("shake");
  }

  if (anger >= 100) {
    explode();
  }
}

function calm(val) {
  if (!started) return;
  anger -= val;
  if (anger < 0) anger = 0;
  update();
}

function startGame() {
  overlay.style.display = "none";
  started = true;
  runSpeech();
}

function runSpeech() {
  if (i >= speech.length) {
    speechBox.style.display = "none";
    return;
  }

  speechBox.style.display = "block";
  speechBox.innerText = speech[i][0];

  anger = speech[i][1];
  update();

  i++;

  setTimeout(runSpeech, 1400);
}

function explode() {
  document.getElementById("boom").style.display = "flex";
  girl.style.display = "none";
  speechBox.style.display = "none";

  setTimeout(() => {
    alert("💥 Unnati exploded!");
    location.reload();
  }, 1500);
}

update();

</script>

</body>
</html>
