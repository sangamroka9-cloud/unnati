<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Unnani Ultimate Quiz Game</title>

<style>
body {
  margin:0;
  font-family: Arial;
  overflow:hidden;
  background: linear-gradient(to bottom, #ffd6e7, #ffb3c6);
}

#title {
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-size:24px;
  font-weight:bold;
  color:#b3003c;
}

/* STICK FIGURE */
#girl {
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  text-align:center;
}

.head {
  width:90px;
  height:90px;
  border:4px solid black;
  border-radius:50%;
  margin:auto;
  background:#ffe0e0;
  position:relative;
}

.eye {
  width:10px;
  height:10px;
  background:black;
  border-radius:50%;
  position:absolute;
  top:32px;
}
.eye.left { left:25px; }
.eye.right { right:25px; }

.mouth {
  width:28px;
  height:12px;
  border-bottom:3px solid black;
  margin:18px auto 0;
  border-radius:50%;
}

.body {
  width:8px;
  height:100px;
  background:black;
  margin:auto;
}

.arms {
  width:110px;
  height:4px;
  background:black;
  margin:-60px auto 0;
}

.legs {
  width:90px;
  height:4px;
  background:black;
  margin:50px auto 0;
}

#emotion {
  margin-top:10px;
  font-weight:bold;
}

/* ANGER BAR */
#barBox {
  position:absolute;
  top:70px;
  left:20px;
  width:260px;
  background:white;
  border:3px solid #ff4d88;
  border-radius:12px;
  padding:10px;
}

#bar {
  width:50%;
  height:20px;
  background:red;
  border-radius:10px;
  transition:0.2s;
}

/* QUESTION */
#question {
  position:absolute;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:15px;
  border-radius:10px;
  border:3px solid black;
  font-weight:bold;
  text-align:center;
  width:340px;
}

/* OPTIONS */
#options {
  position:absolute;
  bottom:30px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

button {
  padding:12px;
  border-radius:12px;
  border:2px solid #ff4d88;
  background:white;
  font-weight:bold;
  cursor:pointer;
  width:240px;
}

/* INTRO */
#intro {
  position:absolute;
  top:18%;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:15px;
  border-radius:10px;
  border:3px solid black;
  font-weight:bold;
  text-align:center;
  width:340px;
  z-index:10;
}

/* END SCREEN */
#end {
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:rgba(0,0,0,0.85);
  color:white;
  z-index:100;
  text-align:center;
}

/* EXPLOSION */
#boom {
  position:absolute;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  font-size:100px;
}
</style>
</head>

<body>

<div id="title">💖 Unnani Quiz Game 💖</div>

<div id="barBox">
  <b>ANGER</b>
  <div id="bar"></div>
</div>

<div id="intro">Loading...</div>

<div id="question">Loading...</div>

<div id="girl">
  <div class="head">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>
  </div>
  <div class="arms"></div>
  <div class="body"></div>
  <div class="legs"></div>
  <div id="emotion">CALM</div>
</div>

<div id="options"></div>

<div id="boom">💥</div>

<div id="end">
  <h1 id="endText"></h1>
  <button onclick="location.reload()">Play Again</button>
</div>

<script>

/* STATE */
let anger = 20;
let q = 0;
let i = 0;
let gameStarted = false;

/* ELEMENTS */
const introBox = document.getElementById("intro");
const questionBox = document.getElementById("question");
const optionsBox = document.getElementById("options");
const bar = document.getElementById("bar");
const emotion = document.getElementById("emotion");
const end = document.getElementById("end");
const endText = document.getElementById("endText");
const boom = document.getElementById("boom");

/* INTRO DIALOGUE */
const introLines = [
  "Ta Jatha",
  "ni gar dai nas",
  "khup raksi khayera bas sale",
  "murda aru kt sanga bolis",
  "ghar auna pardai na jatha",
  "j gare ni gar sale khate jatha muji"
];

/* QUESTIONS */
const questions = [
{
q:"What is her favourite food/snack?",
options:[
["Chatpate 😋",-10],
["Dal Bhat 🍛",10],
["Momo 🥟",10],
["Chowmein 🍜",10]
]
},
{
q:"What is her personality?",
options:[
["Calm 😊",-5],
["Moody 😐",-5],
["Funny 😂",-5],
["Serious 😌",-5]
]
},
{
q:"What is her nickname?",
options:[
["Unnani 💖",-10],
["Bunny 🐰",10],
["Cutie Pie 🍰",10],
["Star Girl ⭐",10]
]
},
{
q:"What should you do when she is angry?",
options:[
["Ignore 😐",15],
["Apologise 💖",-15],
["Argue 😡",25]
]
},
{
q:"What is the best way to fix a mistake?",
options:[
["Say sorry ❤️",-15],
["Ignore 😶",10],
["Blame her 😡",25]
]
},
{
q:"What makes her happiest?",
options:[
["Spend time 💕",-15],
["Ignore messages 📵",15],
["Fight 💥",25]
]
},
{
q:"If she is upset, what should you do first?",
options:[
["Ask 🥺",-15],
["Leave 🚶",20],
["Joke 😐",10]
]
},
{
q:"What builds trust?",
options:[
["Honesty 🤍",-15],
["Lies 🤥",20],
["Secrets 😶",20]
]
},
{
q:"Key to stopping explosion?",
options:[
["Understand 💖",-20],
["Win argument 😤",20],
["Ignore 😬",25]
]
}
];

/* UPDATE UI */
function update() {

  bar.style.width = anger + "%";

  if (anger <= 0) win();
  if (anger >= 100) explode();

  if (anger < 30) emotion.innerText = "CALM ❤️";
  else if (anger < 60) emotion.innerText = "OK 😐";
  else if (anger < 85) emotion.innerText = "ANGRY 😡";
  else emotion.innerText = "VERY ANGRY 💥";
}

/* INTRO */
function runIntro() {

  if (i >= introLines.length) {
    introBox.style.display = "none";
    gameStarted = true;
    loadQuestion();
    return;
  }

  introBox.innerText = introLines[i];
  anger += 6;
  update();

  i++;
  setTimeout(runIntro, 1200);
}

/* QUESTIONS */
function loadQuestion() {

  if (!gameStarted) return;

  if (q >= questions.length) {
    win();
    return;
  }

  let current = questions[q];

  questionBox.innerText = current.q;
  optionsBox.innerHTML = "";

  current.options.forEach(opt => {

    let btn = document.createElement("button");
    btn.innerText = opt[0];

    btn.onclick = () => {
      anger += opt[1];
      q++;
      update();
      loadQuestion();
    };

    optionsBox.appendChild(btn);
  });
}

/* WIN */
function win() {
  end.style.display = "flex";
  endText.innerHTML = "💖 I LOVE YOU 💖";
}

/* EXPLODE */
function explode() {
  boom.style.display = "flex";
  setTimeout(() => {
    end.style.display = "flex";
    endText.innerHTML = "💥 She exploded!";
  }, 1000);
}

/* START GAME */
update();
runIntro();

</script>

</body>
</html>
