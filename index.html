<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;

  #timer {

  #angerText {
    font-weight: bold;

  #angerBarContainer {

<body>

<div id="game">

  <div id="title">💥 Stop Unnati From Exploding 💥</div>

  <div id="angerBox">
    <div id="angerText">ANGER LEVEL 😡</div>

    <div id="angerBarContainer">
      <div id="angerBar"></div>
    </div>
  </div>

  <div id="timer">Survive: <span id="time">60</span>s</div>

  <div id="girl">😡</div>
  <div id="emotion">VERY ANGRY</div>

  <div id="eventPopup">
    <div id="eventText">You forgot to reply 😡</div>

    <button class="responseBtn" onclick="correctAnswer()">Sorry 🥺</button>
    <button class="responseBtn" onclick="wrongAnswer()">Calm down 😭</button>
  </div>

  <div id="buttons">
    <button onclick="reduceAnger(15)">💐 Flowers</button>
    <button onclick="reduceAnger(10)">🍫 Chocolate</button>
    <button onclick="reduceAnger(12)">☕ Tea</button>
    <button onclick="reduceAnger(18)">🧸 Teddy</button>
    <button onclick="reduceAnger(20)">😭 Apologise</button>
    <button onclick="reduceAnger(8)">🎶 Music</button>
  </div>

  <div id="gameOverScreen">
    <h1 id="endTitle">💥 GAME OVER</h1>
    <p id="endText">Unnati exploded from rage 😭</p>
    <button onclick="restartGame()">Play Again</button>
  </div>

</div>

<script>

let anger = 60;
let timeLeft = 60;
let gameEnded = false;

const angerBar = document.getElementById("angerBar");
const girl = document.getElementById("girl");
const emotion = document.getElementById("emotion");
const eventPopup = document.getElementById("eventPopup");
const gameOverScreen = document.getElementById("gameOverScreen");
const endTitle = document.getElementById("endTitle");
const endText = document.getElementById("endText");

function updateUI() {

  angerBar.style.width = anger + "%";

  if (anger < 30) {
    girl.innerHTML = "😊";
    emotion.innerHTML = "CALM ❤️";
  }
  else if (anger < 60) {
    girl.innerHTML = "😐";
    emotion.innerHTML = "STILL ANNOYED";
  }
  else if (anger < 85) {
    girl.innerHTML = "😡";
    emotion.innerHTML = "VERY ANGRY";
  }
  else {
    girl.innerHTML = "🤬";
    emotion.innerHTML = "ABOUT TO EXPLODE";
    girl.classList.add("shake");
    document.body.style.background =
      "linear-gradient(to bottom, #ff6666, #990000)";
  }

  if (anger < 85) {
    girl.classList.remove("shake");
    document.body.style.background =
      "linear-gradient(to bottom, #ffd6e7, #ffb3c6)";
  }

  if (anger >= 100) {
    loseGame();
  }

  if (anger < 0) anger = 0;
}

function reduceAnger(amount) {
  if (gameEnded) return;

  anger -= amount;
  updateUI();
}

function increaseAnger(amount) {
  if (gameEnded) return;

  anger += amount;
  updateUI();
}

setInterval(() => {

  if (gameEnded) return;

  anger += 2;
  updateUI();

}, 1500);

const events = [
  "You forgot to reply 😡",
  "You liked another girl's photo 😭",
  "You said 'calm down' 😬",
  "You were online but ignored her 💀",
  "You forgot anniversary 😭"
];

function showEvent() {

  if (gameEnded) return;

  const randomEvent =
    events[Math.floor(Math.random() * events.length)];

  document.getElementById("eventText").innerHTML = randomEvent;

  eventPopup.style.display = "block";

  setTimeout(() => {

    if (eventPopup.style.display === "block") {
      increaseAnger(15);
      eventPopup.style.display = "none";
    }

  }, 4000);

}

setInterval(showEvent, 9000);

function correctAnswer() {

  eventPopup.style.display = "none";
  reduceAnger(12);

}

function wrongAnswer() {

  eventPopup.style.display = "none";
  increaseAnger(20);

}

const timer = setInterval(() => {

  if (gameEnded) return;

  timeLeft--;

  document.getElementById("time").innerHTML = timeLeft;

  if (timeLeft <= 0) {
    winGame();
  }

}, 1000);

function winGame() {

  gameEnded = true;

  gameOverScreen.style.display = "flex";

  endTitle.innerHTML = "❤️ YOU SAVED UNNATI";
  endText.innerHTML =
    "You successfully stopped her from exploding 😭💖";
}

function loseGame() {

  gameEnded = true;

  gameOverScreen.style.display = "flex";

  endTitle.innerHTML = "💥 GAME OVER";
  endText.innerHTML =
    "Unnati exploded from rage 😭";
}

function restartGame() {
  location.reload();
}

updateUI();

</script>

</body>
</html>
