<script>

/* STATE */
let anger = 20;
let q = 0;
let i = 0;
let started = false;
let timeLeft = 90;
let gameOver = false;

/* ELEMENTS */
const introBox = document.getElementById("intro");
const questionBox = document.getElementById("question");
const optionsBox = document.getElementById("options");
const bar = document.getElementById("bar");
const emotion = document.getElementById("emotion");
const end = document.getElementById("end");
const endText = document.getElementById("endText");
const boom = document.getElementById("boom");

/* TIMER UI */
const timerBox = document.createElement("div");
timerBox.style.position = "absolute";
timerBox.style.top = "70px";
timerBox.style.right = "20px";
timerBox.style.background = "white";
timerBox.style.padding = "10px";
timerBox.style.border = "3px solid black";
timerBox.style.borderRadius = "10px";
timerBox.style.fontWeight = "bold";
document.body.appendChild(timerBox);

/* INTRO */
const introLines = [
  "Ta Jatha",
  "ni gar dai nas",
  "khup raksi khayera bas sale",
  "murda aru kt sanga bolis",
  "ghar auna pardai na jatha",
  "j gare ni gar sale khate jatha muji"
];

/* QUESTIONS */
const questions = [
{
q:"What is her favourite food/snack?",
options:[
["Chatpate 😋",-10],
["Dal Bhat 🍛",10],
["Momo 🥟",10],
["Chowmein 🍜",10]
]
},
{
q:"Who is the sexiest?",
options:[
["Sangam",-5],
["Sangam",-5],
["Sangam",-5],
["Sangam",-5]
]
},
{
q:"What is her nickname?",
options:[
["Unnani 💖",-10],
["Jathi",10],
["Risaune KT",10],
["Pokhara Girl",10]
]
},
{
q:"What should you do when she is angry?",
options:[
["Ignore 😐",15],
["Apologise 💖",-15],
["Argue 😡",25]
]
},
{
q:"What is the best way to fix a mistake?",
options:[
["Say sorry ❤️",-15],
["Ignore 😶",10],
["Blame her 😡",25]
]
},
{
q:"What makes her happiest?",
options:[
["Spend time 💕",-15],
["Ignore messages 📵",15],
["Fight 💥",25]
]
},
{
q:"If she is upset, what should you do first?",
options:[
["Ask 🥺",-15],
["Leave 🚶",20],
["Joke 😐",10]
]
},
{
q:"What builds trust?",
options:[
["Honesty 🤍",-15],
["Lies 🤥",20],
["Secrets 😶",20]
]
},
{
q:"Key to stopping explosion?",
options:[
["Understand 💖",-20],
["Win argument 😤",20],
["Ignore 😬",25]
]
}
];

/* TIMER */
function startTimer(){

  let interval = setInterval(() => {

    if(gameOver) {
      clearInterval(interval);
      return;
    }

    timeLeft--;
    timerBox.innerText = "Time: " + timeLeft + "s";

    if(timeLeft <= 0){
      clearInterval(interval);
      loseByTime();
    }

  },1000);
}

/* INTRO */
function runIntro(){

  introBox.style.display = "block";
  questionBox.style.display = "none";
  optionsBox.style.display = "none";

  if(i >= introLines.length){
    introBox.style.display = "none";
    started = true;
    startTimer(); // 🔥 START TIMER HERE
    loadQuestion();
    return;
  }

  introBox.innerText = introLines[i];
  anger += 5;

  update();

  i++;
  setTimeout(runIntro, 1200);
}

/* QUESTIONS */
function loadQuestion(){

  if(!started || gameOver) return;

  questionBox.style.display = "block";
  optionsBox.style.display = "flex";

  if(q >= questions.length){
    win();
    return;
  }

  let current = questions[q];

  questionBox.innerText = current.q;
  optionsBox.innerHTML = "";

  current.options.forEach(opt => {

    let btn = document.createElement("button");
    btn.innerText = opt[0];

    btn.onclick = () => {
      anger += opt[1];
      q++;
      update();
      loadQuestion();
    };

    optionsBox.appendChild(btn);
  });
}

/* UPDATE */
function update(){

  bar.style.width = anger + "%";

  if(!gameOver && started){

    if(anger <= 0) win();
    if(anger >= 100) explode();
  }

  if(anger < 30) emotion.innerText = "CALM ❤️";
  else if(anger < 60) emotion.innerText = "OK 😐";
  else if(anger < 85) emotion.innerText = "ANGRY 😡";
  else emotion.innerText = "VERY ANGRY 💥";
}

/* WIN */
function win(){
  if(gameOver) return;

  gameOver = true;
  end.style.display = "flex";
  endText.innerHTML = "💖 I LOVE YOU 💖";
}

/* EXPLODE (FIXED CORRECTLY) */
function explode(){
  if(gameOver) return;

  gameOver = true;

  boom.style.display = "flex";

  setTimeout(()=>{
    end.style.display = "flex";
    endText.innerHTML = "💥 SHE EXPLODED!";
  },1000);
}

/* TIME LOSS */
function loseByTime(){
  if(gameOver) return;

  gameOver = true;
  end.style.display = "flex";
  endText.innerHTML = "⏰ TIME OUT! SHE LEFT 😭";
}

/* INIT */
update();
runIntro();

</script>
